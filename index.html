<section id="payment" class="payment-section">

    <span class="section-kicker">SECURE ONLINE PAYMENT</span>

    <h2>ऑनलाइन Payment करें 💳</h2>

    <p class="payment-subtitle">
      नीचे दिए गए QR Code को किसी भी UPI App से Scan करें
    </p>

    <div class="qr-box">
      <img src="payment-qr.jpg" alt="UPI Payment QR Code">

    <a
      class="whatsapp-payment"
